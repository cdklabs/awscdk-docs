name: deploy-and-release
run-name: ${{ inputs.dry_run && format('[DRY RUN] deploy-and-release by @{0}', github.actor) || '' }}
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (skip actual publishing)
        required: false
        type: boolean
  pull_request: {}
  merge_group: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      latest_commit: ${{ steps.git_remote.outputs.latest_commit }}
      tag_exists: ${{ steps.check_tag_exists.outputs.exists }}
      artifact_id: ${{ steps.upload_artifact.outputs.artifact-id }}
    env:
      CI: "true"
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set git identity
        id: set_git_identity
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Install dependencies
        id: install_dependencies
        run: npm ci
      - name: release
        id: release
        run: npx projen release
      - name: Check if version has already been tagged
        id: check_tag_exists
        run: |-
          TAG=$(cat dist/releasetag.txt)
          ([ ! -z "$TAG" ] && git ls-remote -q --exit-code --tags origin $TAG && (echo "exists=true" >> $GITHUB_OUTPUT)) || (echo "exists=false" >> $GITHUB_OUTPUT)
          cat $GITHUB_OUTPUT
      - name: Check for new commits
        id: git_remote
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |-
          echo "latest_commit=$(git ls-remote origin -h "$GITHUB_REF" | cut -f1)" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT
        shell: bash
      - name: Backup artifact permissions
        id: backup_artifact_permissions
        run: cd dist && getfacl -R . > permissions-backup.acl
        continue-on-error: true
      - name: Upload artifact
        id: upload_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-artifact
          path: dist
          overwrite: true
    if: github.ref == 'refs/heads/main'
  build:
    runs-on: codebuild-awscdk-docs-github-actions-runner-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
    steps:
      - id: auto_ba33701f
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: auto_eed99646
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        id: install_dependencies
        run: npm ci
      - name: Build docs
        id: build_docs
        env:
          DOCS_BASE: /cdk/api/
        run: npx projen docs:build:sharded -- --num-shards 52 --heap 8192 --concurrency 16
      - name: Package docs site for S3 publishing
        id: package_docs_site_for_s3_publishing
        run: bash scripts/package-site.sh docs/.vitepress/dist cdk-docs-site.zip
      - name: Upload docs site zip
        id: upload_docs_site_zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docs-site
          path: cdk-docs-site.zip
          retention-days: 1
          compression-level: 0
  release_github:
    name: Publish to GitHub Releases
    needs:
      - release
      - release_docs_awscdk-docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: "!cancelled() && !failure() && needs.release.result == 'success' && needs.release.outputs.tag_exists != 'true'"
    steps:
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Download build artifacts
        id: download_build_artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.release.outputs.artifact_id }}
          path: dist
      - name: Restore build artifact permissions
        id: restore_build_artifact_permissions
        run: cd dist && setfacl --restore=permissions-backup.acl
        continue-on-error: true
      - name: Release
        id: release
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_TAG_FILE: dist/releasetag.txt
          CHANGELOG_FILE: dist/changelog.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          tag=$(cat "$RELEASE_TAG_FILE") &&
          gh release view "$tag" -R "$GITHUB_REPOSITORY" 2>/dev/null ||
          gh release create "$tag" -R "$GITHUB_REPOSITORY" -F "$CHANGELOG_FILE" -t "$tag" --target "$GITHUB_SHA"
  release_docs_awscdk-docs:
    name: Publish docs awscdk-docs to S3
    needs:
      - release
      - build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: release
    if: needs.release.outputs.tag_exists != 'true' && !inputs.dry_run && github.ref == 'refs/heads/main'
    steps:
      - name: Download docs site
        id: download_docs_site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: docs-site
          path: dist
      - name: Authenticate Via OIDC Role
        id: creds
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_FOR_ACCOUNT }}
          role-session-name: s3-cdklabs-awscdk-docs-awscdk-docs-docs-publishing
          mask-aws-account-id: true
      - name: Assume the publishing role
        id: publishing-creds
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.PUBLISH_CDK_REF_DOCS_ROLE_ARN }}
          role-session-name: s3-cdklabs-awscdk-docs-awscdk-docs-docs-publishing
          mask-aws-account-id: true
          role-chaining: true
      - name: Publish docs awscdk-docs
        id: publish_docs_awscdk-docs
        env:
          BUCKET_NAME: ${{ vars.DOCS_BUCKET_NAME }}
          DOCS_STREAM: awscdk-docs
          ARTIFACT: dist/cdk-docs-site.zip
          VERSIONS_JSON: cdk/api/versions.json
          VERSION_PATTERN: ^v?(\d+)\.(\d+)\.(\d+)(?:-[0-9A-Za-z.-]+)?$
        run: |-
          echo "Uploading cdklabs-awscdk-docs-awscdk-docs to S3"
          echo "::add-mask::$BUCKET_NAME"

          CDK_META=$(unzip -p "$ARTIFACT" "$VERSIONS_JSON" | node -e "
            const data = JSON.parse(require('fs').readFileSync(0, 'utf-8'));
            const lib = data.packages.find((p) => p.package === 'aws-cdk-lib');
            if (!lib) throw new Error('versions.json has no aws-cdk-lib entry');
            const published = new Date(lib.date).toISOString().replace(/\.\d{3}Z$/, 'Z');
            console.log(lib.version, published);
          ")
          CDK_VERSION=$(echo "$CDK_META" | cut -d' ' -f1)
          CDK_PUBLISHED=$(echo "$CDK_META" | cut -d' ' -f2)
          if [ -z "$CDK_VERSION" ] || [ -z "$CDK_PUBLISHED" ]; then
            echo "::error::could not resolve the documented aws-cdk-lib version from the site zip"
            exit 1
          fi
          if ! node -e "
            const pattern = new RegExp(process.env.VERSION_PATTERN);
            if (!pattern.test(process.argv[1])) process.exit(1);
          " "$CDK_VERSION"; then
            echo "::error::the documented aws-cdk-lib version is not a valid version: $CDK_VERSION"
            exit 1
          fi
          echo "Documented aws-cdk-lib: $CDK_VERSION (published $CDK_PUBLISHED)"

          S3_PATH="$DOCS_STREAM/awscdk-docs-v$CDK_VERSION.zip"
          LATEST="latest-awscdk-docs"

          aws s3api put-object \
            --bucket "$BUCKET_NAME" \
            --key "$S3_PATH" \
            --body "$ARTIFACT"

          echo "Artifact uploaded, checking the latest marker"

          MARKER_EXISTS=false
          if HEAD_ERR=$(aws s3api head-object --bucket "$BUCKET_NAME" --key "$LATEST" 2>&1 >/dev/null); then
            MARKER_EXISTS=true
          elif ! echo "$HEAD_ERR" | grep -q "(404)"; then
            echo "::error::could not read the existing $LATEST marker: $HEAD_ERR"
            exit 1
          fi
          EXISTING_VERSION=""
          if [ "$MARKER_EXISTS" = "true" ]; then
            if ! EXISTING_MARKER=$(aws s3 cp "s3://$BUCKET_NAME/$LATEST" -); then
              echo "::error::could not read the existing $LATEST marker"
              exit 1
            fi
            EXISTING_VERSION=$(echo "$EXISTING_MARKER" | grep "^version=" | cut -d= -f2- || true)
          fi
          MARKER_ORDER=$(node -e "
            const pattern = new RegExp(process.env.VERSION_PATTERN);
            const parts = (v) => (v.match(pattern) || []).slice(1, 4).map(Number);
            const [current, existing, markerExists] = process.argv.slice(1);
            const cur = parts(current);
            if (cur.length !== 3) { console.error('not a valid version: ' + current); process.exit(1); }
            if (markerExists !== 'true') { console.log('absent'); process.exit(0); }
            const prev = parts(existing);
            if (prev.length !== 3) { console.log('invalid'); process.exit(0); }
            const diff = cur.map((n, i) => n - prev[i]).find((d) => d !== 0) || 0;
            console.log(diff > 0 ? 'newer' : diff < 0 ? 'older' : 'equal');
          " "$CDK_VERSION" "$EXISTING_VERSION" "$MARKER_EXISTS")

          if [ "$MARKER_ORDER" = "older" ]; then
            echo "::warning::not updating $LATEST: it points at $EXISTING_VERSION, newer than this build's $CDK_VERSION. The artifact is still available at $S3_PATH."
            exit 0
          fi
          if [ "$MARKER_ORDER" = "invalid" ]; then
            echo "::warning::existing $LATEST marker has no parseable version; overwriting with a valid manifest"
          fi

          echo "Updating latest marker ($MARKER_ORDER)"
          printf '#manifest-version:2\nartifact_path=%s\nversion=%s\npublished=%s\nrebuild_nonce=%s\n' \
            "$S3_PATH" "$CDK_VERSION" "$CDK_PUBLISHED" "$GITHUB_SHA" \
            | aws s3 cp - "s3://$BUCKET_NAME/$LATEST"
