name: docs-e2e
on:
  pull_request: {}
  merge_group: {}
  workflow_dispatch: {}
jobs:
  e2e:
    runs-on: codebuild-awscdk-docs-github-actions-runner-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
    steps:
      - id: auto_ba33701f
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: auto_eed99646
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        id: install_dependencies
